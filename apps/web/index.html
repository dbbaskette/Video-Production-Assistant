<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Production Assistant</title>

    <!-- Tanzu uses Arial. Keeping the stack local also prevents a network
         font from delaying first paint or changing metrics after load. -->

    <!--
      Theme bootstrap. Runs before React mounts so the first paint already
      has the right `data-theme` attribute set and we avoid a light→dark
      flash on dark-mode users. Reads localStorage.vpaTheme first
      ('light' | 'dark'); falls back to OS preference if no choice saved.
      The ThemeToggle component (and ThemeStore in `lib/theme.ts`) own
      writing to localStorage.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('vpaTheme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            saved === 'light' || saved === 'dark' ? saved : prefersDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
